# The Failure class ledger (#21): each recurring generation problem and how it is handled now.
# handler: heal (code fixes the output), check (code rejects it, the repair loop fixes it), structured (the model gives
# plain data and code compiles the fragile syntax), lesson (a short rule appended to the listed Model steps' prompts;
# only when code can't handle it), or none (not hardened yet).
# hardened: when the handler shipped (UTC, like Trace times), so the report can compare the rate before and after.
# test: the regression test built from the real failing example.
# The /harden Claude Code skill adds entries; the classes themselves come from course_factory.failures.CLASSES.

schema:questions.correct:type:
  handler: heal
  what: a bare quiz `correct` index is coerced to a list
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_a_single_correct_index_becomes_a_list

mermaid-render:
  handler: heal
  what: double-escaped LaTeX in Mermaid labels is healed; spaces and line breaks around math survive rendering
  hardened: 2026-11-10
  test: tests/test_checks.py::test_diagram_labels_with_line_breaks_and_math_render

render-dom-global:
  handler: check
  what: Mermaid labels with HTML are render-checked with DOM globals (was "Element is not defined")
  hardened: 2026-11-10
  test: tests/test_checks.py::test_diagram_labels_with_line_breaks_and_math_render

placeholder-section:
  handler: check
  what: placeholder Sections (under the word minimum) are rejected and rewritten
  hardened: 2026-11-10
  test: tests/test_chapters.py::test_a_placeholder_section_is_written_again

ascii-math:
  handler: check
  what: formulas written as code outside $…$ are rejected
  hardened: 2026-11-10
  test: tests/test_checks.py::test_a_formula_written_as_code_in_text_is_flagged

diagram-ids:
  handler: structured
  what: diagrams and step diagrams are nodes and edges compiled to Mermaid; highlights must be node ids
  hardened: 2026-11-10
  test: tests/test_checks.py::test_a_diagram_edge_to_a_missing_node_is_flagged

schema:questions.prompt:missing:
  handler: heal
  what: quiz `question` is read as `prompt`; option objects {text, correct, explanation} and `correct_index` are unpacked
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_field_names_the_model_writes_instead_are_healed_not_repaired
schema:questions.explanation:missing:
  handler: heal
  what: a quiz question without `explanation` takes the right option's from `explanations`
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_field_names_the_model_writes_instead_are_healed_not_repaired
schema:blanks.answers:missing:
  handler: heal
  what: fill_blanks `accepted`/`answer` are read as `answers`
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_field_names_the_model_writes_instead_are_healed_not_repaired
schema:entries.command:missing:
  handler: heal
  what: terminal `input`/`cmd`/`text` are read as `command`, `comment`/`description` as `note`
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_field_names_the_model_writes_instead_are_healed_not_repaired
schema:steps.highlight:missing:
  handler: heal
  what: step_diagram `node`/`id` (one id) is read as `highlight` [id]
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_field_names_the_model_writes_instead_are_healed_not_repaired
not-a-block:
  handler: heal
  what: a Block without `origin` is from_source when it cites pages, else model_added
  hardened: "2026-11-10 00:43"
  test: tests/test_checks.py::test_a_block_without_origin_takes_it_from_its_citations
tool-arg:stringified-json:
  handler: heal
  what: "an array/object argument of cf_return_result sent as a JSON string (blocks = \"[...]\") is parsed before validation"
  hardened: "2026-11-10 14:05"
  test: tests/test_pi_step.py::test_an_array_sent_as_a_json_string_is_parsed_before_validation

progression:
  handler: check
  what: practice that tests a Concept taught later (the Concept ledger), an answer nothing taught or gave, or a drill previewing a later Section's command is flagged course-wide and repaired; a hyphenated Concept name (docker-compose) is one word, so its parts' stems no longer match unrelated words (composant); a starter line kept as is in a code_exercise solution, or a name the fill_blanks template already writes, is not expected of the learner
  hardened: "2026-11-14 20:52"
  test: tests/test_progression.py::test_a_hyphenated_command_in_a_concept_name_is_one_word

repeat:
  handler: check
  what: a practice Block or quiz question asking what an earlier one of its Chapter asked, with the same names and values, is flagged course-wide and repaired with another case; the writer is told to give each practice its own data
  hardened: 2026-11-10
  test: tests/test_progression.py::test_practice_repeating_an_earlier_one_with_the_same_names_and_values_is_flagged

diagram-chain:
  handler: check
  what: a diagram drawn as one chain whose words say it fans out (replication, workers, broadcast) is flagged to branch
  hardened: 2026-11-10
  test: tests/test_progression.py::test_a_chain_diagram_whose_caption_describes_a_fan_out_is_flagged

plan:
  handler: check
  what: a Chapter plan breaking the learning-design rules (objective without practice at its level, ramp out of order, quiz without misconceptions, uncovered Question Type) is re-asked once; a Section missing planned practice is re-written once
  hardened: 2026-11-10
  test: tests/test_lesson_plan.py

quiz-cue:
  handler: check
  what: '"all/none of the above" is an error; so is a right option clearly the longest (1.25x and 8+ chars) in most questions, twice as long in one, or longest in all 3+; bare names are left out; the repair loop rewrites the wrong options'
  hardened: "2026-11-22 16:03"
  test: tests/test_checks.py::test_a_quiz_whose_right_option_is_clearly_the_longest_goes_to_repair

diagram-size:
  handler: check
  what: a flowchart with more than 9 nodes or a label longer than 6 words is a warning on the Block
  hardened: 2026-11-10
  test: tests/test_lesson_plan.py

definition-cram:
  handler: check
  what: a definition theorem_box with three or more bold "Term:" leads is a warning on the Block; the write prompt asks for one theorem_box per term
  hardened: 2026-11-10
  test: tests/test_lesson_plan.py

figure-fidelity:
  handler: check
  what: a diagram citing a page read with figures keeps under 60% of their entities, or flattens their containment (no subgraph), is a warning on the Block naming what is missing; read_page records each figure's entities, containment and relations, and write_section gets them
  hardened: 2026-11-11
  test: tests/test_lesson_plan.py

section-overlap:
  handler: check
  what: two Sections of a Chapter drilling the same commands (method + endpoint, or calls not the Chapter's boilerplate) or Concepts get a warning naming each other; the Review page merges one into the other
  hardened: 2026-11-11
  test: tests/test_progression.py

outline-incomplete:
  handler: check
  what: propose_outline returned valid JSON for the first Chapter only (course 6, qwen 27B, 18 sources); an outline that cites no page of some course notes is rejected and the retry names the notes left out
  hardened: 2026-11-11
  test: tests/test_outline.py

schema:claims.op:enum:
  handler: heal
  what: claim op aliases (eq, equals, ==, gradient, derivative...) map to equal/diff/grad/hessian; ops sympy can't decide drop the claim
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_claim_ops_the_model_aliases_are_not_schema_errors

schema:claims.op:missing:
  handler: heal
  what: a claim without op gets one from its answer key (derivative, gradient, value...) or from "lhs == rhs" in expr, else equal
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_claims_in_the_shapes_the_model_writes_are_checked_not_flagged

schema:claims.expected:missing:
  handler: heal
  what: the answer under derivative/gradient/value/result becomes expected; a claim with no answer at all is dropped
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_claims_in_the_shapes_the_model_writes_are_checked_not_flagged

schema:claims.expected.list:type:
  handler: heal
  what: numbers and nested lists in expected are coerced to strings
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_claims_in_the_shapes_the_model_writes_are_checked_not_flagged

schema:claims.expected.str:type:
  handler: heal
  what: numbers and nested lists in expected are coerced to strings
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_claims_in_the_shapes_the_model_writes_are_checked_not_flagged

sympy-wrong:
  handler: check
  what: false alarms removed (x1/lam read as one symbol, diff without vars tries each variable, log identities expanded, a grad/hessian under equal checked as one); a claim names its point in "at" and is checked there; with no point, it is skipped only when some real point fits
  test: tests/test_checks.py::test_a_claim_at_a_point_is_checked_there
  hardened: "2026-11-14 16:26"

sympy-unparsable:
  handler: heal
  what: a claim sympy cannot read checks nothing and is skipped instead of flagging the Block
  hardened: "2026-11-09 15:19"
  test: tests/test_checks.py::test_a_claim_sympy_cannot_parse_does_not_flag_the_block

bad-json:
  handler: heal
  what: a cf_return_result call Qwen writes as text (<tool_call><function=cf_return_result><parameter=...>) is read as the call, each argument as its schema type; empty or prose answers still fail and retry
  hardened: "2026-11-14 16:26"
  test: tests/test_pi_step.py::test_a_result_tool_call_written_as_text_is_read_as_the_call

lab-check:
  handler: heal
  what: a backslash-n left in Lab code where a line ends (escape_latex read "\\nu, v = ..." as LaTeX) becomes a newline; slow Solutions (120 s), missing modules and wrong asserts still go to repair
  hardened: "2026-11-14 16:27"
  test: tests/test_labs.py::test_a_newline_kept_as_latex_nu_in_code_is_a_newline

katex-parse:
  handler: check
  what: "math is read outside code spans only, as remark-math renders it: a Makefile's $(VENV_DIR) in a code block is not a KaTeX error"
  hardened: "2026-11-14 20:44"
  test: tests/test_checks.py::test_dollars_in_a_code_span_are_not_math

listen-formula:
  handler: check
  what: a formula Listen cannot turn into words (a backslash, dollar, underscore, caret or brace left after maths-to-speech) is never sent to a Voice; Listen says "the formula on screen" and the Block goes to the Review Queue
  hardened: "2026-11-15 12:00"
  test: tests/test_listen.py::test_formulas_never_reach_a_voice_with_a_symbol_in_them

video-render:
  handler: check
  what: a Video that could not be rendered (Manim failed or timed out) goes to the Review Queue with its log; the Block shows its narration as text meanwhile
  hardened: "2026-11-15 12:00"
  test: tests/test_video.py::test_a_failed_render_goes_to_the_review_queue_with_its_log

dockerfile-runtime:
  handler: check
  what: a Dockerfile that parses but fails at docker build (several COPY sources into a path without a trailing /) or at start (CMD/ENTRYPOINT runs a file no COPY/ADD brings in); seen from Qwen 3.8 and Inkling 2 Mini
  hardened: "2026-11-22 12:00"
  test: tests/test_checks.py::test_a_dockerfile_that_would_fail_to_build_or_start_is_flagged

blank-regex:
  handler: check
  what: a fill-in-the-blank regex that matches none of its own answers (escapes written twice) or uses Python-only syntax like (?i) that the browser's RegExp rejects
  hardened: "2026-11-22 12:00"
  test: tests/test_checks.py::test_a_blank_regex_must_work_in_the_app

order:
  handler: lesson
  what: a Section goes from its opening prose straight to a theorem_box or key_formula with no concrete case before it (43 of the 74 order warnings; Cram and Deep alike); order warnings stay on the trace, since a rewrite for them doubled the time per Section
  hardened: "2026-11-25 10:40"
  test: tests/test_lesson_plan.py::test_the_writer_is_told_to_put_a_case_between_the_opening_and_the_first_definition
  steps: [write_section]
  lesson: "Put one concrete case between the opening prose and the first theorem_box or key_formula (a small example in prose, a table, a figure or a worked example), in Cram too: a definition right after the opening is the most frequent order mistake."
