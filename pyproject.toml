[project]
name = "course-factory"
version = "0.1.0"
description = "Interactive courses from study material, generated by local models"
readme = "README.md"
authors = [
    { name = "mohamedkhayat", email = "132056305+mohamedkhayat@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
course-factory = "course_factory:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]
